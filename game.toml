# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "R4"
id = "SLPS-01798"
players = 2
exe = "disc/SLPS_017.98"
disc = "/home/claude/disc/R4.cue"
load_address = "0x80010000"
entry_pc = "0x8007D4B4"
text_size = "0x0009C000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "R4.bin"
cue_name = "R4.cue"
boot_exe = "SLPS_017.98"
known_sizes = [622452096]
known_md5 = [
  "7adde24b05ae254ef51ee2053f0b405a",
]
known_sha1 = [
  "cb8770bcb9e5c9645165e26ebcea7735cc0b7afd",
]
known_crc32 = [
  "e0b4611e",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# R4 GameShark mods (mods/preloaded/packages/r4.gameshark): the plugin installs
# the code caves and hooks at the top of the PS-X EXE entry point, before any
# game function runs (src/r4_gameshark.c).
mod_function_entry_funcs = ["0x8007D4B4"]

[runtime]
# Skip PsyQ libetc v_wait (the VSync spin R4 runs every frame) in whole loop
# passes up to the next device event: guest cycles, device writes and
# scratchpad are unchanged (frame_fingerprint judge columns identical over
# 700+ race frames at the 300% overclock); -14% emulation-thread time.
# Audit of the SLPS-01798 v_wait at 0x8008B068 (docs/config_schema.md
# contract): it stores timeout << 15 at 0x10(sp) and returns if the VSync
# count (0x800A6178) already reached a0; 0x8008B090 loads the counter,
# subtracts 1, stores and reloads it, taking the timeout path (0x8008B0B0:
# "VSync: timeout", ChangeClearPAD(0), ChangeClearRCnt(3,0)) only at -1;
# 0x8008B0D8 reloads the VSync count and loops while it is below a0; exit
# 0x8008B0F0. The -1 test is the only counter-dependent exit; the counter is
# a private stack slot.
idle_skip = true
idle_skip_store_counters = true
idle_skip_store_counter_sites = ["0x8008B090", "0x8008B0D8"]
window_title = "R4 Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# PGXP ships through the (default-on) PGXP mod only, as RidgeRacerType4Recomp
# does: hook build, dataflow only, no clamp, exact projection.
pgxp_mod_only = true
pgxp_preserve_projection = true
# Internal resolution follows the monitor (Match display, capped at 2160
# lines) at a FIXED scale: no supersampling and no dynamic resolution (its
# surface reallocations are the suspected source of the v0.2 hitches).
internal_resolution = "display"
match_display_max_lines = 2160
dynamic_resolution = false
# GL work on its own thread so driver stalls never cost the guest a frame
# (the framework's own R4 measurements, docs/RENDER_THREAD.md).
render_thread = true

# The 60 FPS GameShark patch needs the "CPU 300%" overclock: each MIPS
# instruction is charged 1/3 of its guest cycles. Gated: it only applies while
# the 60 FPS feature's plugin holds the gate open (mods are cleared online).
[timing]
guest_cycle_scale = 3
guest_cycle_scale_gated = true
# Scaled CPU charges batched like the scale-1 path (same fractional carry and
# flush points, guest timing unchanged; framework-verified on R4 races).
# Measured -7% emulation-thread time in a race.
guest_cycle_scale_batch = true

# The 16:9 GameShark patch does its own FOV/HUD work and expects a plain
# stretched 16:9 present. native_wide=false keeps the presenter on the
# stretch path; the plugin then keeps the GTE/GPU squash at identity.
[widescreen]
native_wide = false

[controller]
default_mode = "analog"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "5dda2f17751d5791af09e48cc1170d9ace018b2e5bd29b4f029f2bcab067c50c"
