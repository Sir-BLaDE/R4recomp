format_version = 5
id = "r4.controls"
version = "1.0.0"
name = "R4 analog steering (JogCon)"
author = "R4Recomp"
description = "Analog steering for R4 through the controller this edition supports natively, the Namco JogCon, built from your gamepad."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPS-01798"

[[feature]]
id = "negcon"
name = "Analog steering (JogCon)"
description = "Presents your gamepad as a JogCon: the left stick turns the wheel; R1, the right trigger or Cross accelerates; L1, the left trigger or Square brakes. Other buttons keep their place. Keyboard play is unchanged."
group = "Controls"
default_enabled = true

[[plugin]]
feature = "negcon"
id = "r4.analog"

# The race HUD draws a JogCon dial indicator (nine marks and a pointer at the
# bottom of the screen) whenever a JogCon is connected: 0x8002254C tests the
# per-player JogCon flag (beqz v0 -> skip). Always skip it.
[[patch]]
feature = "negcon"
target = "main_exe"
address = 0x8002254C
expected = "5b 00 40 10"
replace = "5b 00 00 10"
