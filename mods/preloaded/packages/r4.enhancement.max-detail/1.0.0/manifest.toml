format_version = 7
id = "r4.enhancement.max-detail"
version = "1.0.0"
name = "R4 Max Detail"
author = "Shokunin"
description = "Removes R4's distance-based detail reductions: longer draw distance, full course textures and shading at every distance, full car models, split screen at the 1P level and reflective cars in races, plus an optional full rear-view mirror. On by default; every part can be set back to stock."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# Ported to R4 (SLPS-01798) from tetrisgm/RidgeRacerType4Recomp (MIT): the car
# table is at 0x8009EDE8 in the JP boot EXE (USA 0x8009F228, same bytes); the
# writes stay guarded by the stock bytes.
[[target]]
game_id = "SLPS-01798"

[[feature]]
id = "max-detail"
name = "Max Detail"
description = "On by default. R4 lowers detail with distance to fit the PlayStation's budget; this draws everything at full detail instead. Game logic is unchanged. Netplay always plays stock."
group = "Detail"
default_enabled = true

[[option]]
feature = "max-detail"
id = "draw_distance"
label = "Draw distance"
description = "Stock drops course polygons past the end of the game's depth table, so far bridges and buildings pop in late. Extended keeps them, drawn behind everything nearer, and draws cars up to 14000 away instead of 8704. Maximum also loads the road and scenery of up to 32 track sections ahead, as many as the PlayStation's frame time and drawing memory allow in each scene, so the game always stays at full speed."
group = "Detail"
type = "choice"
default = "maximum"

[[option.choice]]
value = "maximum"
label = "Maximum (Recommended)"

[[option.choice]]
value = "extended"
label = "Extended"

[[option.choice]]
value = "stock"
label = "Stock"

[[option]]
feature = "max-detail"
id = "course"
label = "Course detail"
description = "Always full keeps full-resolution textures and smooth shading on the course at every distance and in the rear-view mirror. Stock switches distant course polygons (and everything in the mirror) to a half-resolution texture with flat shading."
group = "Detail"
type = "choice"
default = "full"

[[option.choice]]
value = "full"
label = "Always full (Recommended)"

[[option.choice]]
value = "stock"
label = "Stock"

[[option]]
feature = "max-detail"
id = "cars"
label = "Car detail"
description = "Always full draws every car with its full model (3D wheels, full-resolution texture) out to the normal car draw distance, and the rear-view mirror shows cars as far back as you see them ahead. Stock swaps in simpler models a short way off."
group = "Detail"
type = "choice"
default = "full"

[[option.choice]]
value = "full"
label = "Always full (Recommended)"

[[option.choice]]
value = "stock"
label = "Stock"

[[option]]
feature = "max-detail"
id = "split_screen"
label = "Split screen"
description = "Same as 1P gives each half of a two-player race the 1P course subdivision and car models. Stock uses coarser subdivision and closer car model switches in two-player races."
group = "Detail"
type = "choice"
default = "same"

[[option.choice]]
value = "same"
label = "Same as 1P (Recommended)"

[[option.choice]]
value = "stock"
label = "Stock"

[[option]]
feature = "max-detail"
id = "reflections"
label = "Car reflections"
description = "On gives the cars their reflective bodies during the race too, as in the fly-by, replays and the attract demo. Stock turns them off from the start signal to the finish line, as R4 does on a PS1. For now On applies only to 4:3 views: widened views keep Stock, because the widescreen renderer draws the reflective parts many times slower."
group = "Detail"
type = "choice"
# R4Recomp: Stock by default. With real 60 FPS every reflective car body is
# drawn and emulated twice as often as in a 30 FPS race; on the starting grid
# (all cars in view) On pushed the emulation past one VBlank (user perf log,
# 2026-11-09).
default = "stock"

[[option.choice]]
value = "stock"
label = "Stock (Recommended)"

[[option.choice]]
value = "on"
label = "On"

# R4Recomp: how much of a 16.7 ms frame the emulation may use before Maximum
# draw distance gives sections back. With the real 60 FPS patch every race
# frame is emulated in one VBlank (a 30 FPS build has two), so this decides
# how much of the pop-in is removed on a given CPU.
[[option]]
feature = "max-detail"
id = "cpu_budget"
label = "CPU budget (Maximum draw distance)"
description = "Maximum draw distance adds far track sections only while the emulation of a frame fits this budget, so the game stays at 60 FPS. Balanced (14.5 ms of the 16.7 ms frame) suits most PCs. Safe (12.5 ms) leaves more margin and removes less pop-in. No limit always draws the full distance, as on a 30 FPS build: all pop-in gone, but a CPU that cannot emulate it in time drops frames. The perf log (R4_perf_log.txt) shows the level in use as md=<level>."
group = "Detail"
type = "choice"
default = "balanced"

[[option.choice]]
value = "balanced"
label = "Balanced (Recommended)"

[[option.choice]]
value = "safe"
label = "Safe"

[[option.choice]]
value = "off"
label = "No limit"

# Off by default (owner decision, 2026-10-01): it costs the emulated PS1
# the most time of anything in this package (docs/MAX_DETAIL.md).
[[option]]
feature = "max-detail"
id = "mirror"
label = "Mirror scenery"
description = "Full draws all the scenery behind you in the rear-view mirror. Stock draws only the nearest few track blocks there, as on a PS1. Full takes the emulated PlayStation longer each frame, and with a full grid of cars around it can drop below 30 FPS."
group = "Detail"
type = "choice"
default = "stock"

[[option.choice]]
value = "stock"
label = "Stock (Recommended)"

[[option.choice]]
value = "full"
label = "Full"

# Car models: 0x8009EDE8 (JP) holds, per view, the distances (s16 T0, T1, T2) up
# to which the full model, the simpler model and any model is drawn. Rows:
# 1P, rear-view mirror, TV/replay, 2P, 2P alternate. T2 (8704) is the car
# draw distance and is never raised: past it R4's car transform overflows
# and draws far cars huge and misplaced.
[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EDE8
expected = "a0 02 80 0c 00 22"
replace = "00 22 00 22 00 22"
when = { cars = "full" }

[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EDEE
expected = "ff ff 00 0a 00 10"
replace = "a0 02 00 22 00 22"
when = { cars = "full" }

[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EDF4
expected = "00 10 00 20 00 22"
replace = "00 22 00 22 00 22"
when = { cars = "full" }

[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EDFA
expected = "40 01 80 0c 00 22"
replace = "00 22 00 22 00 22"
when = { cars = "full" }

[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EE00
expected = "a0 00 00 0a 00 22"
replace = "00 22 00 22 00 22"
when = { cars = "full" }

# Split screen = same as 1P with stock cars: both 2P rows take the 1P row.
[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EDFA
expected = "40 01 80 0c 00 22"
replace = "a0 02 80 0c 00 22"
when = { cars = "stock", split_screen = "same" }

[[patch]]
feature = "max-detail"
target = "main_exe"
address = 0x8009EE00
expected = "a0 00 00 0a 00 22"
replace = "a0 02 80 0c 00 22"
when = { cars = "stock", split_screen = "same" }

[[plugin]]
feature = "max-detail"
id = "r4.maxdetail"
