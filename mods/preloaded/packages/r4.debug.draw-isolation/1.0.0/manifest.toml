format_version = 7
id = "r4.debug.draw-isolation"
version = "1.0.0"
name = "R4 Draw Isolation Gate"
author = "Shokunin"
description = "Developer gate for threaded drawing: runs every race draw call against a private copy of guest RAM, scratchpad and GTE registers and logs per-tick state and frame hashes (docs/DRAW_ISOLATION.md)."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00797"

[[feature]]
id = "draw-isolation"
name = "Draw isolation gate"
description = "base logs the stock run; nest runs draw calls nested without isolation; iso runs them isolated (the gate); poison also inverts draw-owned bytes for the main context to find every read. Compare logs with tools/draw_iso_gate.py."
group = "Developer"
channel = "developer"
default_enabled = false

[[option]]
feature = "draw-isolation"
id = "mode"
label = "Mode"
group = "Developer"
type = "choice"
default = "iso"

[[option.choice]]
value = "base"
label = "Log only (reference)"

[[option.choice]]
value = "nest"
label = "Nested calls, no isolation"

[[option.choice]]
value = "iso"
label = "Isolated (the gate)"

[[option.choice]]
value = "poison"
label = "Isolated with poison (diagnostic)"

[[plugin]]
feature = "draw-isolation"
id = "r4.draw-isolation"
