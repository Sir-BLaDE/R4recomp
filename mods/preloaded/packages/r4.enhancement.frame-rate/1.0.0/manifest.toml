format_version = 7
id = "r4.enhancement.frame-rate"
version = "1.0.0"
name = "R4 Frame Rate"
author = "Shokunin"
description = "Redraws intermediate race frames while preserving the original game logic."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00797"

[[feature]]
id = "frame-rate"
name = "Race frame rate"
description = "60 FPS races: interpolate car and camera positions between game ticks. Extra frames redraw geometry; logic, input and audio keep their original 30 Hz cadence. 30 FPS shows the original frames only."
group = "Display"
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Presentation rate"
group = "Display"
type = "choice"
default = "30"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "30"
label = "30 FPS (original)"

[[plugin]]
feature = "frame-rate"
id = "r4.framerate"
netplay = "local_view"
