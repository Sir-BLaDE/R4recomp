format_version = 7
id = "r4.enhancement.frame-rate"
version = "1.0.0"
name = "R4 Frame Rate"
author = "Shokunin"
description = "Redraws intermediate race frames while preserving the original game logic."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00797"

[[feature]]
id = "frame-rate"
name = "Race frame rate"
description = "Choose a presentation rate or follow the display refresh. Extra frames redraw geometry; logic, input and audio keep their original 30 Hz cadence. 30 FPS shows the original frames only."
group = "Display"
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Presentation rate"
group = "Display"
type = "choice"
default = "60"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "display"
label = "Match display refresh"

[[option.choice]]
value = "30"
label = "30 FPS (original)"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "100"
label = "100 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option]]
feature = "frame-rate"
id = "method"
label = "Redraw method"
group = "Display"
type = "choice"
default = "fields"

[[option.choice]]
value = "fields"
label = "Blend car and camera values"

[[option.choice]]
value = "projection"
label = "Replay recorded projections"

[[plugin]]
feature = "frame-rate"
id = "r4.framerate"
netplay = "local_view"

[[plugin]]
feature = "frame-rate"
id = "r4.framerate.projection"
