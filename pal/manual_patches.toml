# --- 0x8005CA88 (USA 0x8005CD98): counter capped at 120 s (3000 frames at 25 Hz -> 3600 at 30 Hz).
[[recompiler.patch]]
id = "pal-cap-slti"
address = "0x8005D1B4"
expected = "0x28420BB9"
replacement = "0x28420E11"
note = "slti v0,v0,3601"
[[recompiler.patch]]
id = "pal-cap-li"
address = "0x8005D1BC"
expected = "0x24020BB8"
replacement = "0x24020E10"
note = "li v0,3600"

# --- 0x8001ECE8 (USA 0x8001ECE0): DISPENV.screen.h is a constant 256 in PAL, the buffer height (s2) in USA.
[[recompiler.patch]]
id = "pal-disp-screen-h"
address = "0x8001EE48"
expected = "0x24020100"
replacement = "0x02401021"
note = "addu v0,s2,zero (screen.h = 240)"

# --- 0x80020B10 (USA 0x80020A98): race layer (param_1 > 1) that sets its draw area to
# (0, n*256, 320, 256). With the NTSC-ised buffers at 0 / 240, the first buffer overflows into the first
# 16 lines of the second one, which never redraws them (its area starts at 256): a band flickers at the
# top of the screen during races. Sequence rewritten in place: RECT (0, n ? 240 : 0, 320, 240).
[[recompiler.patch]]
id = "pal-layer-area-wh-1"
address = "0x80020C54"
expected = "0x24020140"
replacement = "0x3C0300F0"
note = "lui v1,0x00F0"

[[recompiler.patch]]
id = "pal-layer-area-wh-2"
address = "0x80020C58"
expected = "0xA7A20014"
replacement = "0x34630140"
note = "ori v1,v1,0x0140 (w = 320, h = 240)"

[[recompiler.patch]]
id = "pal-layer-area-wh-3"
address = "0x80020C64"
expected = "0x24030100"
replacement = "0xAFA30014"
note = "sw v1,20(sp): RECT.w / RECT.h"

[[recompiler.patch]]
id = "pal-layer-area-y-1"
address = "0x80020C6C"
expected = "0xA7A30016"
replacement = "0x00021023"
note = "subu v0,zero,v0 (-n)"

[[recompiler.patch]]
id = "pal-layer-area-y-2"
address = "0x80020C70"
expected = "0x00021200"
replacement = "0x304200F0"
note = "andi v0,v0,0xF0 (n ? 240 : 0), stored to RECT.y by the sh in the jal delay slot"
