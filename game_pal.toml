[controller]
# R4 identifies digital (0x41), DualShock (0x73), NeGcon (0x23) and JogCon
# (0xE3) pads. Use the game's native DualShock analog steering for ordinary
# gamepads. A recognized SDL wheel is presented as JogCon regardless of this
# gamepad default.
default_mode = "analog"
# Rewind's default controller button is Y alone (Triangle). It acts alone only
# while the r4.modern-controls Modern scheme allows it
# (psx_mod_allow_direct_shortcut); otherwise it means Select + Y.
direct_shortcut = "rewind"
direct_shortcut_button = "y"
# players = 4 is the netplay seat ceiling for the online Link Battle; R4
# itself has no multitap support, so offline play keeps two standalone pads.
multitap = false
# EXPERIMENTAL JogCon wheel force feedback is a player setting, OFF by
# default: Controls > "Wheel force feedback (experimental)" saves
# settings.toml [controller] jogcon_force_feedback. Only a force-feedback
# wheel presented as JogCon is driven (SDL haptics); gamepads never are.
# Direction is unverified on a physical wheel (psxrecomp psx_jogcon_ffb.h).
experimental_jogcon_force_feedback = false

# Online mount gate: digests + track count + TOC fingerprint
# (psxrecomp/docs/NETPLAY.md). required_tracks = 1 is correct for this disc.
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "67c3f74deb52d98f4197bcb550551db4da74f29338bdc397a44d7859798043ff"

# ── Audit-specific config (consumed by psxrecomp/tools/*.py and tests) ──
[audit]
[[audit.regions]]
name        = "Text"
rom_start   = "0x800"          # offset within the PS-X EXE file (skip header)
rom_end     = "0x9C800"        # rom_start + text_size
vaddr_base  = "0x80010000"

# Address normalization: KSEG masking only (game loads contiguously, no remaps).
[audit.normalize]
kseg_mask = "0x1FFFFFFF"

