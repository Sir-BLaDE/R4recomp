# Hand-written patches for the functions Namco rewrote for 25 Hz PAL (they cannot be matched
# automatically). Each sequence reproduces the arithmetic of the USA function (SLUS-00797).

# --- 0x8002BB88 (USA 0x8002C004): frames -> "M:SS" text. PAL n/25, USA n/30 (magic 0x88888889,
# addu, sra 4). n >= 0 is guaranteed by the bltz at entry: the sign correction goes away.
[[recompiler.patch]]
id = "pal-mss-lui"
address = "0x8002BB90"
expected = "0x3C0251EB"
replacement = "0x3C028888"
note = "lui v0,0x8888"
[[recompiler.patch]]
id = "pal-mss-ori"
address = "0x8002BB94"
expected = "0x3442851F"
replacement = "0x34428889"
note = "ori v0,v0,0x8889"
[[recompiler.patch]]
id = "pal-mss-mfhi"
address = "0x8002BBA0"
expected = "0x000417C3"
replacement = "0x00004010"
note = "mfhi t0"
[[recompiler.patch]]
id = "pal-mss-addu"
address = "0x8002BBA4"
expected = "0x00004010"
replacement = "0x01044021"
note = "addu t0,t0,a0"
[[recompiler.patch]]
id = "pal-mss-sra"
address = "0x8002BBA8"
expected = "0x000828C3"
replacement = "0x00082903"
note = "sra a1,t0,4  (seconds = n/30)"
[[recompiler.patch]]
id = "pal-mss-nop"
address = "0x8002BBAC"
expected = "0x00A22823"
replacement = "0x00000000"
note = "nop (sign is zero)"

