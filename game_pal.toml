[runtime]
debug_port = 4797
window_title = "Ridge Racer Type 4 Recompiled"
memcard_dir = "saves"
# Hidden mod features are runtime rules, never launcher choices: the
# r4.modern-controls split-screen-rewind rule (no Rewind in 2P VS Battle).
hide_hidden_mod_features = true
# Authentic guest CD timing. R4 streams XA music with a Form-1 data channel
# (channel 7 carries the elapsed-time words the CPU reads while music plays)
# and polls GetlocP, so the guest-visible CD must never be sped up. Fast loads,
# if wanted, come from the framework's host-pacing mod, not from disc_speed.
disc_speed = "1x"
# Host-side wait-loop elision (psxrecomp docs/config_schema.md idle_skip):
# PsyQ's v_wait -- the VSync(0) spin at 0x8008B4A8 that ends every race tick
# -- counts a stack timeout down each pass, so it needs the store-counter
# extension. Skips whole passes up to the next device event; guest cycles,
# device writes and the scratchpad stay bit-identical (3600-frame race A/B),
# and it is off under netplay. About a third less emulation-thread time in
# races, which is what a Steam Deck or an M1 runs out of first.
idle_skip = true
idle_skip_store_counters = true
# Audited site (psxrecomp docs/config_schema.md, store-counter contract):
# v_wait's loop blocks. 0x8008B4D0 decrements the 0x10(sp) timeout and
# leaves only when it equals -1 (the "VSync: timeout" path, 0x8008B4F0);
# 0x8008B518 loops back while the VSync count at 0x800A6548 is below the
# target, else exits at 0x8008B530. No other exit depends on the counter,
# and the skip never lowers it to 1 or below. Unlisted sites never skip.
idle_skip_store_counter_sites = ["0x8008B2F4", "0x8008B33C"]
# Code overlays: R4.BIN entries 659-672 are linked at 0x801149A8 (the end of
# BSS) and loaded by the EXE at each mode change (garage, VS car select, time
# attack / extra trial course info, records, link battle, the libpress movie
# player). The runtime captures them as they execute and compiles them to
# native shards in the background; until a shard exists that code runs in the
# dirty-RAM interpreter. The same region is reused as heap during races, so
# dispatch is always gated on the resident bytes.
overlay_cache = true
overlay_backend = "auto"
# No overlay_autocompile_cmd here: the release zip ships overlay_toolchain/
# beside the exe and the runtime builds the compile command from it; a command
# set here would override that. Dev runs pass the dev command through
# PSX_OVERLAY_AUTOCOMPILE_CMD (tools/run_r4.sh, tools/run_r4.cmd).

[timing]
# Title constant (not a player setting). No CPU is emulated: recompiled code
# charges the guest clock a fixed cost per instruction, and guest_cycle_scale
# = N charges 1/N of it; VBlank, timers, CD, SPU and DMA keep hardware time.
# 2, the smallest scale at which Max Detail's governor holds its cap (level
# 30) in 1P and 2P races (docs/MAX_DETAIL.md). Larger scales add no detail
# but make every guest poll loop (VSync, pad SIO) spin longer on the host.
# Online peers must match (it is part of the content fingerprint).
guest_cycle_scale = 2
# Only in races: the scale applies while R4's pacing word (VSync(1)
# threshold) holds the race value 0x180, judged by psxrecomp at every VBlank;
# menus, loading and FMV keep faithful timing.
guest_cycle_scale_gate = { addr = 0x800AC5DC, value = 0x180 }
# ...and only with Max Detail active: it holds a scaled race tick at two
# VBlanks (opens the mod gate on activation). Online, mod plans are cleared,
# so the scale stays off there.
guest_cycle_scale_gated = true
# Batch the scaled CPU charge like the unscaled path (psxrecomp
# guest_cycle_scale_batch): the same guest timing, frame-fingerprint
# identical in 1P and 2P races, with less host work per instruction.
guest_cycle_scale_batch = true

[video]
# The stock 4:3 frame. Widescreen is the r4.enhancement.widescreen mod
# (Mods > Display > R4 Custom Renderer, on by default with Fit to Window),
# which selects the aspect itself; with it off, races are this 4:3.
renderer = "opengl"
aspect_ratio = "4:3"
# R4 ships Match display (the monitor's full pixel height, no cap) as its
# default internal resolution; the framework default is Native. A player's
# pick in Settings -> Display is saved to settings.toml and outranks this, as
# does a saved legacy supersampling factor (psxrecomp docs/config_schema.md).
internal_resolution = "display"
# Internal resolution presets divide their target height by this: R4's races
# are 320x240 progressive, so 4K is 9x and 8K is 18x. Its 480i menus render at
# twice the target and are resolved down.
resolution_reference_lines = 240
# Supersampling (Settings -> Display -> Supersampling): render 1.5x the
# Match display target and resolve down to the window. No post-process
# anti-aliasing filter on top (antialiasing_mode = "off").
supersample = 1.5
antialiasing_mode = "off"
# Dynamic resolution (framework controller): keep the selected internal
# resolution while the game has room; step down only after missed frame
# budgets, never below the display's own lines ("display": the monitor's
# height, i.e. the supersample factor is what gives way first), and back up
# after sustained headroom. It does nothing at Native. Off: Settings ->
# Display -> Dynamic resolution. Owner decision 2026-10-08: Ultra is the
# default everywhere and the dynamic systems are its safety net, so the floor
# is native x1 (it only goes below the display's own lines when a machine
# cannot hold 60 Hz above them).
dynamic_resolution = true
dynamic_resolution_min = "native"
# Render thread (psxrecomp docs/RENDER_THREAD.md): the OpenGL backend runs on
# its own thread, so a frame costs max(game, GL) instead of game + GL. Nothing
# the guest reads back changes. Off for one run: PSX_RENDER_THREAD=0. Smooth
# motion and the present thread need it.
render_thread = true
# Present thread (docs/RENDER_THREAD.md "Present thread"): the window swap
# leaves the render thread. Off for one run: PSX_PRESENT_THREAD=0.
present_thread = true
# Smooth motion (psxrecomp docs/FRAME_GENERATION.md; Settings -> Display ->
# Smooth motion): in-between frames up to the display's refresh (any rate,
# VRR too), only when there is measured time to spare; real frames always
# come first and no guest code runs again. R4 opts in to reprojection: each
# in-between frame warps the newer real frame (its object rules were tuned on
# R4); cars are redrawn at their own in-between position. PSX_FRAME_GEN=0 or
# PSX_FRAME_GEN_METHOD=redraw for one run.
frame_generation = true
frame_generation_method = "reprojection"
# VS split screen draws its far road through per-primitive texture windows
# (about 515 GP0(E2h) changes a game frame). Let the OpenGL renderer batch
# across them: the same image in about a tenth of the draws, so 2P with
# widescreen at high internal resolutions costs about what 1P does (see
# docs/WIDESCREEN.md). PSX_GL_TEXWIN_BATCH=0 turns it off for one run.
texture_window_batching = true
# PGXP (psxrecomp docs/ENHANCEMENTS.md G1.11/G1.12). PGXP itself is switched
# on by the psx.enhancement.pgxp package, default on for R4 together with its
# precise culling option (mods/preloaded overrides the builtin's defaults),
# which netplay clears. pgxp_mod_only makes that package the one switch: the
# geometry_correction / perspective_texturing keys (here or in a player's
# settings.toml) are not applied and the launcher hides its Perspective
# textures row. The runtime is built with the PGXP hooks (CMakeLists.txt
# R4_PGXP), which track 99.8% of R4's polygon vertices, so the tuning keys,
# inert while PGXP is off, are:
pgxp_mod_only = true             # the Mods page is the one PGXP switch
pgxp_tolerance = -1.0            # no clamp: at 0.5 it keeps ~25% of vertices and draws seams
pgxp_position_fallback = false   # dataflow only: the position cache only mislabels HUD vertices
pgxp_preserve_projection = true  # exact projection: no residual wobble on near geometry
# PGXP extras (also inert while PGXP is off): a per-pixel depth buffer from
# PGXP depth (no painter's-order sorting errors where polygons cross), Gouraud
# colour correction across PGXP-moved vertices, and "fine" seam closing
# between neighbouring polygons.
pgxp_depth_buffer = true
pgxp_color_correction = true
pgxp_seam = "fine"
# Ultra's visual features (psxrecomp #584, #585, #588, #589): emulated
# mipmaps with 16x anisotropic taps on minified world textures, chroma
# smoothing on 24-bit FMV frames, bloom from 3D and additive primitives (never
# the HUD), and no PS1 dither pattern (true colour). xBR and accurate
# blending stay off.
texture_lod = "mipmap"
anisotropic_filtering = 16
fmv_chroma_smoothing = true
bloom = 1.0
dithering = "off"

# Graphics presets (psxrecomp docs/QUALITY_PRESETS.md). Ultra is the default;
# on first launch, and when the machine changes, psxrecomp steps down only a
# machine whose GPU class cannot hold 60 Hz even at the dynamic floor (Steam
# Deck, small iGPUs, software GL); Settings -> Display -> Graphics preset shows it, offers
# Re-detect, and becomes Custom once the player changes a setting a preset
# sets (Custom is never overridden). Presets set detail, never the frame rate
# (owner, 2026-10-20): Smooth motion stays on in every preset, Low included;
# it only uses spare render time. Each table is [video] keys laid over the
# [video] block above, which is Ultra. Dynamic resolution stays on in every
# preset as the safety net. Measured on R4 races (analysis/lowend-perf):
# Smooth motion is the largest render-thread cost (~60-70 % of it), the
# supersample factor the largest GPU cost; PGXP's depth/colour/seam extras
# cost ~0.7 ms of render-thread CPU and no measurable GPU time; Low drops them.
[quality.ultra]
# The [video] block as shipped and the first-launch default: Match display
# x1.5 floored at native, Smooth motion from surplus, PGXP extras, mipmaps +
# 16x aniso, FMV chroma smoothing, bloom.

[quality.high]
supersample = 1.25

[quality.medium]
supersample = 1.0
texture_lod = "off"
anisotropic_filtering = 1
# Bloom stays on: R4 opts in (owner, 2026-10-13); only Low drops it.

[quality.low]
# Detected low-end machines: Steam Deck, integrated GPUs, Apple M1/M2 base. PGXP
# itself stays on (it closes the seams), and so does its depth buffer: Max
# Detail's far sections and Smooth motion's reprojection need real depth, or
# distant scenery draws over walls and swims when turning (owner, 2026-10-20).
# Its other renderer extras go: colour correction, seam expansion. In R4 they only move polygon
# silhouette edges by one output pixel (0.02 % of a road frame, 0 pixels in
# the tunnel at 10x; analysis/lowend-perf/seams), no cracks.
supersample = 1.0
dynamic_resolution_min = "native"
pgxp_color_correction = false
pgxp_seam = "off"
texture_lod = "off"
anisotropic_filtering = 1
fmv_chroma_smoothing = false
bloom = 0.0

# Native-wide rendering for r4.enhancement.widescreen (docs/WIDESCREEN.md).
# Inert at 4:3: every cull site below is the identity while the margin is 0.
[widescreen]
native_wide = true        # the framework default, stated for clarity

